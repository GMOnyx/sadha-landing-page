<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Email preferences | Sadha</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f4f0e8; color: #111; font-family: Arial, sans-serif; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; }
      main { width: 100%; max-width: 480px; padding: 32px 24px; background: #fff; border: 1px solid #ded8cc; border-radius: 18px; text-align: center; }
      h1 { font-size: 28px; line-height: 1.2; overflow-wrap: break-word; }
      p { line-height: 1.6; }
      .brand { font-weight: 700; margin: 0 0 28px; }
      button { background: #000; color: #fff; padding: 15px 24px; border: 0; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; min-height: 48px; }
      button:disabled { opacity: .65; cursor: wait; }
      a { color: #111; }
      [hidden] { display: none !important; }
      #status { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Sadha</p>
      <h1 id="title">No more demo follow-ups?</h1>
      <p id="copy">You can still book a demo any time.</p>
      <button id="unsubscribe" type="button">Unsubscribe</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p><a href="https://sadha.ai/">Back to Sadha</a></p>
      <noscript><p>Please enable JavaScript to save your preference, or reply to the email asking us not to contact you.</p></noscript>
    </main>
    <script>
      const token = new URLSearchParams(location.search).get("token") || "";
      const button = document.getElementById("unsubscribe");
      const status = document.getElementById("status");
      // This page deliberately contains no analytics or third-party resources.
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token)) {
        button.hidden = true;
        document.getElementById("title").textContent = "Invalid link";
        document.getElementById("copy").textContent = "Please use the unsubscribe link in your email.";
      }
      button.addEventListener("click", async () => {
        button.disabled = true;
        status.textContent = "Saving your preference…";
        try {
          const response = await fetch(`https://vriofvpoagfnlmrbepkm.supabase.co/functions/v1/demo-followup-preferences?token=${encodeURIComponent(token)}`, {
            method: "POST", signal: AbortSignal.timeout(15000),
          });
          const data = await response.json();
          if (!response.ok || !data.unsubscribed) throw new Error("SAVE_FAILED");
          document.getElementById("title").textContent = "You’re unsubscribed";
          document.getElementById("copy").textContent = "You won’t receive further demo follow-ups from us.";
          button.hidden = true;
          status.textContent = "";
          history.replaceState(null, "", location.pathname);
        } catch {
          status.textContent = "We couldn’t save your preference. Please try again, or reply to the email and we’ll help.";
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
